# =================================================================
# OmniStock Nginx Server Block Configuration
# Place this file in /etc/nginx/sites-available/inventory
# and symlink to /etc/nginx/sites-enabled/
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name inventory.yourdomain.com; # Change to your domain or server IP

    # Root directory of the application
    root /var/www/html/inventory_system;
    index index.php index.html;

    # Character Set
    charset utf-8;

    # Maximum file upload / request body size
    client_max_body_size 32M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets Caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # PHP FastCGI Processing
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Adjust PHP-FPM socket path to your PHP version:
        # e.g., unix:/run/php/php8.3-fpm.sock or unix:/run/php/php8.2-fpm.sock or 127.0.0.1:9000
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Block sensitive directories and files
    location ~ ^/(config|database)/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(sql|sqlite|lock|log|bat|ps1|md|yml|yaml|env|ini)$ {
        deny all;
        return 404;
    }
}
